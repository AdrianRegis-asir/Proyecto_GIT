name: Comprobacion Tokens

on: [push]

jobs:
  verificar-token:
    runs-on: self-hosted
    steps:
      - name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
        shell: powershell
        run: |
          $localVal = [System.Environment]::GetEnvironmentVariable("LOCAL_DEV_TOKEN", "Machine")
          if (-not $localVal) {
            $localVal = $env:LOCAL_DEV_TOKEN
          }
          
          if ($env:DEV_SECRET -and ($env:DEV_SECRET.Trim() -eq $localVal.Trim())) {
            Write-Host "COINCIDEN: DEV_TOKEN y LOCAL_DEV_TOKEN son iguales"
            exit 0
          } else {
            Write-Host "No coinciden o falta valor."
            exit 1
          }
        env:
          DEV_SECRET: ${{ secrets.DEV_TOKEN }}